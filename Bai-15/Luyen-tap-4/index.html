<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thi cuối kỳ HSK 1 – Đề 2</title><style>:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#182238;background:#f5f7fc}*{box-sizing:border-box}body{margin:0}.wrap{max-width:850px;margin:auto;padding:20px}.hero,.panel{background:white;border:1px solid #e1e5ef;border-radius:16px;padding:22px;margin-bottom:18px}.hero h1{margin:0 0 8px}.muted{color:#63708a}.stats{display:flex;gap:15px;flex-wrap:wrap}.stats span{background:#eef3ff;padding:8px 12px;border-radius:9px}input[type=text]{width:100%;padding:12px;border:1px solid #b9c5d9;border-radius:9px;font-size:16px}.question{padding:17px 0;border-bottom:1px solid #e8eaf1}.question:last-child{border:0}.qtitle{font-weight:650;white-space:pre-line;line-height:1.6}.option{display:block;padding:11px;margin:8px 0;border:1px solid #d9e0ec;border-radius:10px;cursor:pointer}.option:has(input:checked){border-color:#315ed1;background:#edf3ff}.option input{margin-right:9px;accent-color:#315ed1}button{padding:13px 20px;background:#315ed1;color:white;border:0;border-radius:10px;font-size:16px;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.wrong{color:#b12735}.correct{color:#168044}.result{background:#edf8f1;border:1px solid #b8e0c5;padding:18px;border-radius:12px;margin:15px 0}.hidden{display:none}#status{margin-top:12px;white-space:pre-line}footer{font-size:13px;color:#69768d;margin-bottom:35px}@media(max-width:600px){.wrap{padding:12px}.hero,.panel{padding:16px}}</style></head><body><main class="wrap"><header class="hero"><h1>期末考试 · HSK 1</h1><p>Đề thi cuối kỳ tiếng Trung – Đề số 2</p><div class="stats"><span>⏱ <strong id="timer">60:00</strong></span><span>📝 25 câu</span><span>⭐ 10 điểm</span><span id="progress">0/25 đã làm</span></div><p class="muted">Mỗi câu đúng 0,4 điểm. Hết 60 phút bài sẽ tự nộp.</p><label for="student"><strong>Họ và tên thí sinh *</strong></label><input id="student" type="text" maxlength="120" placeholder="Nhập họ tên đầy đủ" required></header><form id="exam"></form><div class="panel"><button id="submitBtn" type="button">Nộp bài và chấm điểm</button><p id="status" role="status"></p><div id="result" class="hidden"></div></div><footer>Kết quả được gửi qua FormSubmit tới email giáo viên. Lần đầu sử dụng, giáo viên cần xác nhận email kích hoạt FormSubmit. Không đóng trang khi đang gửi.</footer></main><script>
const EMAIL_ENDPOINT = 'https://formsubmit.co/dungtran92qc@gmail.com';
const sections=[
{title:'一、看拼音，选择正确的汉字。（2 分）',desc:'Nhìn Pinyin, chọn chữ Hán đúng.',qs:[['diànnǎo',['电影','电脑','学校','医院'],1],['xīngqītiān',['星期天','今天','明天','今年'],0],['hē chá',['吃米饭','看书','喝茶','喝水'],2],['tiānqì',['下雨','天气','今天','现在'],1],['péngyou',['同学','老师','学生','朋友'],3]]},
{title:'二、看汉字，选择正确的拼音。（2 分）',desc:'Nhìn chữ Hán, chọn Pinyin đúng.',qs:[['医院',['yīshēng','yīyuàn','xuéxiào','diànyǐng'],1],['苹果',['píngguǒ','péngyou','shuǐguǒ','xīguā'],0],['今年',['jīntiān','míngtiān','jīnnián','zuótiān'],2],['学校',['xuéshēng','xuéxiào','lǎoshī','tóngxué'],1],['下雨',['xiàwǔ','xiàmiàn','xiàyǔ','xiànzài'],2]]},
{title:'三、选择正确的词语填空。（2 分）',desc:'Chọn từ thích hợp điền vào chỗ trống.',qs:[['A：你叫什么_____？\nB：我叫李月。',['名字','国家','老师','朋友'],0],['A：你家有_____口人？\nB：我家有四口人。',['多少','几','什么','谁'],1],['A：你想_____什么？\nB：我想喝水。',['吃','看','喝','买'],2],['A：你的书在哪儿？\nB：我的书在桌子_____。',['上面','今年','学校','时候'],0],['A：明天天气怎么样？\nB：明天很_____。',['医生','冷','名字','电脑'],1]]},
{title:'四、连词成句，选择正确的句子。（2 分）',desc:'Chọn câu có thứ tự từ đúng.',qs:[['你 / 是 / 哪 / 国 / 人',['你哪国是人？','你是哪国人？','哪国你是人？','你是人哪国？'],1],['我 / 妈妈 / 会 / 做 / 中国菜',['我妈妈会做中国菜。','我会妈妈做中国菜。','中国菜做会我妈妈。','我妈妈做会中国菜。'],0],['桌子 / 上面 / 有 / 一 / 本 / 书',['有桌子一本书上面。','桌子有上面一本书。','桌子上面有一本书。','一本书桌子有上面。'],2],['现在 / 几 / 点 / 了',['几现在点了？','现在了几点？','几点现在了？','现在几点了？'],3],['我们 / 明天 / 去 / 学校',['我们明天去学校。','明天学校我们去。','我们去明天学校。','学校明天去我们。'],0]]},
{title:'五、阅读对话，选择正确的答案。（2 分）',desc:'Đọc hội thoại và chọn câu trả lời đúng.',qs:[['A：你是哪国人？\nB：我是越南人。\n\nB是哪国人？',['中国人','美国人','越南人','北京人'],2],['A：你爸爸在哪儿工作？\nB：我爸爸在医院工作。\n\n他爸爸在哪儿工作？',['学校','医院','商店','电影院'],1],['A：你想喝茶吗？\nB：不，我想喝水。\n\nB想喝什么？',['茶','水','米饭','西瓜'],1],['A：你家有几口人？\nB：我家有五口人。\n\nB家有几口人？',['三口','四口','六口','五口'],3],['A：你下午去学校吗？\nB：不，我下午去商店买苹果。\n\nB下午去哪儿？',['商店','学校','医院','电影院'],0]]}
];
const form=document.getElementById('exam'),status=document.getElementById('status'),result=document.getElementById('result');let submitted=false;const started=Date.now();let timeLeft=3600;
sections.forEach((s,si)=>{const section=document.createElement('section');section.className='panel';const h=document.createElement('h2');h.textContent=s.title;section.append(h);const d=document.createElement('p');d.className='muted';d.textContent=s.desc;section.append(d);s.qs.forEach((q,qi)=>{const n=si*5+qi,box=document.createElement('div');box.className='question';const title=document.createElement('div');title.className='qtitle';title.textContent=(qi+1)+'. '+q[0];box.append(title);q[1].forEach((opt,oi)=>{const lab=document.createElement('label');lab.className='option';const inp=document.createElement('input');inp.type='radio';inp.name='q'+n;inp.value=oi;inp.addEventListener('change',updateProgress);lab.append(inp,document.createTextNode(String.fromCharCode(65+oi)+'. '+opt));box.append(lab)});section.append(box)});form.append(section)});
function getAnswers(){return Array.from({length:25},(_,i)=>{const c=document.querySelector('input[name="q'+i+'"]:checked');return c?Number(c.value):null})}function updateProgress(){document.getElementById('progress').textContent=getAnswers().filter(x=>x!==null).length+'/25 đã làm'}
const timer=setInterval(()=>{if(submitted){clearInterval(timer);return}timeLeft=Math.max(0,3600-Math.floor((Date.now()-started)/1000));document.getElementById('timer').textContent=String(Math.floor(timeLeft/60)).padStart(2,'0')+':'+String(timeLeft%60).padStart(2,'0');if(!timeLeft)submitExam(true)},1000);
function submitExam(auto=false){if(submitted)return;const name=document.getElementById('student').value.trim();if(!name&&!auto){alert('Vui lòng nhập họ và tên trước khi nộp bài.');document.getElementById('student').focus();return}const ans=getAnswers();const blank=ans.filter(x=>x===null).length;if(!auto&&blank&&!confirm('Bạn còn '+blank+' câu chưa làm. Vẫn nộp bài?'))return;if(!auto&&!confirm('Xác nhận nộp bài thi?'))return;submitted=true;clearInterval(timer);document.querySelectorAll('input').forEach(e=>e.disabled=true);document.getElementById('submitBtn').disabled=true;const key=sections.flatMap(s=>s.qs.map(q=>q[2]));const correct=ans.filter((a,i)=>a===key[i]).length;const score=Number((correct*.4).toFixed(1));const duration=Math.min(3600,Math.floor((Date.now()-started)/1000));result.classList.remove('hidden');const summary=document.createElement('div');summary.className='result';const heading=document.createElement('h2');heading.textContent='Kết quả: '+score.toFixed(1)+'/10 điểm';const info=document.createElement('p');info.textContent=(name||'(Chưa nhập họ tên)')+' · Đúng '+correct+'/25 câu · Thời gian '+Math.floor(duration/60)+' phút '+duration%60+' giây';summary.append(heading,info);result.append(summary);sections.forEach((s,si)=>{const p=document.createElement('p');p.textContent='Phần '+(si+1)+': '+(s.qs.filter((q,qi)=>ans[si*5+qi]===q[2]).length*.4).toFixed(1)+'/2 điểm';result.append(p)});sections.forEach((s,si)=>s.qs.forEach((q,qi)=>{const box=form.children[si].querySelectorAll('.question')[qi];const note=document.createElement('p');const ok=ans[si*5+qi]===q[2];note.className=ok?'correct':'wrong';note.textContent=(ok?'✓ Đúng':'✗ Sai')+' · Đáp án: '+String.fromCharCode(65+q[2])+'. '+q[1][q[2]];box.append(note)}));const payload={student:name||'(Chưa nhập họ tên - hết giờ)',score,correct,total:25,durationSeconds:duration,submittedAt:new Date().toLocaleString('vi-VN'),answers:ans,details:sections.flatMap((s,si)=>s.qs.map((q,qi)=>({question:si*5+qi+1,answer:ans[si*5+qi]===null?'Bỏ trống':String.fromCharCode(65+ans[si*5+qi]),correctAnswer:String.fromCharCode(65+q[2]),isCorrect:ans[si*5+qi]===q[2]})))};status.textContent='Đang gửi kết quả về email giáo viên…';sendResult(payload)}
function sendResult(payload){
 const frame=document.createElement('iframe');frame.name='formsubmit_receiver_'+Date.now();frame.style.display='none';frame.title='Gửi kết quả';document.body.append(frame);
 const post=document.createElement('form');post.method='POST';post.action=EMAIL_ENDPOINT;post.target=frame.name;post.style.display='none';post.acceptCharset='UTF-8';
 const add=(k,v)=>{const f=document.createElement('input');f.type='hidden';f.name=k;f.value=String(v);post.append(f)};
 add('_subject','Kết quả thi HSK 1 - '+payload.student+' - '+payload.score+'/10');
 add('_captcha','false');add('_template','table');add('_replyto','');
 add('Họ tên học viên',payload.student);add('Điểm',payload.score+'/10');add('Số câu đúng',payload.correct+'/25');
 add('Thời gian làm bài',Math.floor(payload.durationSeconds/60)+' phút '+payload.durationSeconds%60+' giây');
 add('Thời điểm nộp',payload.submittedAt);
 for(let i=0;i<5;i++)add('Điểm phần '+(i+1), (payload.details.slice(i*5,i*5+5).filter(d=>d.isCorrect).length*.4).toFixed(1)+'/2');
 add('Chi tiết đáp án',payload.details.map(d=>'Câu '+d.question+': chọn '+d.answer+' | đúng '+d.correctAnswer+' | '+(d.isCorrect?'ĐÚNG':'SAI')).join(' ; '));
 document.body.append(post);
 let loaded=false;
 frame.addEventListener('load',()=>{if(!loaded){loaded=true;status.textContent='Đã gửi yêu cầu chuyển kết quả qua FormSubmit. Không thể xác minh email đã tới hộp thư từ trang này. Lần đầu giáo viên cần xác nhận email kích hoạt FormSubmit.'}});
 try{post.submit()}catch(e){status.textContent='Không gửi được yêu cầu. Vui lòng kiểm tra kết nối mạng và thử lại.'}
 setTimeout(()=>{if(!loaded)status.textContent='Đã thử gửi kết quả. Chưa xác nhận được việc giao email; hãy kiểm tra hộp thư giáo viên (kể cả Spam).'},8000);
}
document.getElementById('submitBtn').addEventListener('click',()=>submitExam(false));
</script></body></html>
