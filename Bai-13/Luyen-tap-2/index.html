<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>美食大挑战 · Khám phá ẩm thực Trung Quốc</title><style>
:root{--red:#a72231;--gold:#f4c86d;--cream:#fff7e8;--ink:#382a34}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#fff4d9,#f8dfcd 65%,#edc9b8);color:var(--ink);font-family:system-ui,'Segoe UI',sans-serif;min-height:100vh}button,input{font:inherit}button{cursor:pointer;border:0;border-radius:14px;padding:12px 18px;font-weight:800;transition:.15s}button:hover{transform:translateY(-2px)}button:disabled{opacity:.5;cursor:not-allowed;transform:none}.primary{background:var(--red);color:white;box-shadow:0 4px 0 #711524}.secondary{background:white;color:var(--red);border:1px solid #dfb5a5}.wrap{max-width:1100px;margin:auto;padding:22px 18px 50px}header{text-align:center;background:linear-gradient(130deg,#a32231,#d24c39);color:#fff7e6;padding:28px 16px;border-radius:26px;box-shadow:0 12px 28px #8b30243a}header h1{font-size:clamp(26px,3.5vw,44px);line-height:1.3;margin:12px 0}header p{margin:6px 0;color:#ffe3b7}.pill{display:inline-block;padding:6px 12px;border-radius:99px;background:#ffffff25;font: size:100px}.tabs{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:20px 0}.tabs button{background:#fff9ed;color:#8d2d34;border:1px solid #e7bca5}.tabs button.active{background:#a72231;color:#fff}.board{background:#fffaf2;border:1px solid #eed6c0;border-radius:24px;box-shadow:0 10px 30px #77422b18;padding:clamp(16px,3vw,28px)}h2{margin:0 0 12px;color:#962332}p{line-height:1.55}.muted{color:#806c69}.status{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:16px}.progress{height:10px;background:#f0ded2;border-radius:99px;overflow:hidden;margin:14px 0}.progress>div{height:100%;background:#bd3a42;transition:width .2s}.photo{width:100%;height:280px;object-fit:contain;border-radius:16px;background:#f6e6d7}.flash{max-width:620px;margin:auto}.flash-card{border:2px solid #e9c7ac;border-radius:20px;background:#fff;overflow:hidden;cursor:pointer;text-align:center;min-height:385px}.flash-card img{width:100%;height:285px;object-fit:contain;background:#f6e7d8}.flash-card .detail{padding:13px}.han{font-size:30px;font-weight:900;color:#9c2431}.py{color:#b14c42;font-weight:700}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:18px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:18px}.choice{background:#fff;border:2px solid #e9d6c4;color:#4d3434;text-align:left;min-height:70px}.choice.correct{background:#dcf4df;border-color:#4ca25e}.choice.wrong{background:#ffe1df;border-color:#d94e4e}.question{font-size:22px;font-weight:800;margin:12px 0}.feedback{min-height:46px;margin-top:15px;font-weight:700}.ok{color:#21743a}.bad{color:#ae2d32}.center{text-align:center}.study-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-top:18px}.mini{background:white;border:1px solid #edd3c0;border-radius:16px;overflow:hidden;text-align:center}.mini img{width:100%;height:150px;object-fit:contain;background:#f4e6da}.mini div{padding:10px}.mini strong{font-size:20px;color:#972d32}.scorebig{font-size:56px;font-weight:900;color:#a72231;margin:12px}.hidden{display:none!important}@media(max-width:550px){.choices{grid-template-columns:1fr}.photo{height:220px}.flash-card img{height:230px}.flash-card{min-height:335px}.wrap{padding:10px 10px 32px}.tabs button{font-size:13px;padding:10px}}
.vocab-tools{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}.vocab-tools input{flex:1;min-width:190px;border:1px solid #dfb5a5;border-radius:12px;padding:11px 14px;background:white}.vocab-table-wrap{overflow-x:auto}.vocab-table{width:100%;border-collapse:collapse;background:white;border-radius:14px;overflow:hidden}.vocab-table th,.vocab-table td{padding:11px 12px;text-align:left;border-bottom:1px solid #f0dfd3}.vocab-table th{background:#f6e2d0;color:#862332}.vocab-table .word{font-size:23px;font-weight:800;color:#9c2431;white-space:nowrap}.vocab-table button{padding:6px 9px}.breakdown{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:12px;margin-top:16px}.break-card{background:#fff;border:1px solid #eed6c0;border-radius:15px;padding:14px}.break-card h3{margin:0 0 6px;color:#982c37}.word-chip{display:inline-block;background:#fff0dc;border:1px solid #edcfaa;border-radius:9px;padding:5px 8px;margin:3px;font-size:14px}@media print{header,.tabs,.vocab-tools button,.vocab-table button{display:none!important}body{background:white}.board{box-shadow:none;border:0}.wrap{max-width:none}}@media(max-width:550px){.vocab-table th,.vocab-table td{padding:8px 6px;font-size:13px}.vocab-table .word{font-size:19px}}
</style></head><body><div class="wrap"><header><span class="pill">中国美食 · Zhōngguó měishí</span><h1><p>KHÁM PHÁ 10 MÓN ĂN<br> NỔI TIẾNG TRUNG QUỐC</p></header><nav class="tabs"><button data-tab="list" class="active">📖 Bảng 10 món</button><button data-tab="flash">📚 Flashcard</button><button data-tab="match">🗺️ Ghép địa phương</button><button data-tab="quiz">🏆 Trắc nghiệm</button><button data-tab="vocab">🈶 Từ vựng tách nhỏ</button><button id="musicToggle" class="secondary" type="button" aria-pressed="false">🎵 Bật nhạc nền</button></nav><main class="board" id="app"></main></div><script>
const data=[
{cn:'北京烤鸭',py:'Běijīng kǎoyā',vi:'Vịt quay Bắc Kinh',place:'北京',loc:'Bắc Kinh',img:'01_vit_quay_bac_kinh.png'},
{cn:'麻婆豆腐',py:'Mápó dòufu',vi:'Đậu phụ Mapo',place:'四川',loc:'Tứ Xuyên',img:'02_dau_phu_mapo.png'},
{cn:'重庆火锅',py:'Chóngqìng huǒguō',vi:'Lẩu Trùng Khánh',place:'重庆',loc:'Trùng Khánh',img:'03_lau_trung_khanh.png'},
{cn:'小笼包',py:'Xiǎolóngbāo',vi:'Tiểu long bao',place:'上海',loc:'Thượng Hải',img:'04_tieu_long_bao.png'},
{cn:'兰州牛肉面',py:'Lánzhōu niúròu miàn',vi:'Mì bò Lan Châu',place:'甘肃·兰州',loc:'Lan Châu, Cam Túc',img:'05_mi_bo_lan_chau.png'},
{cn:'肉夹馍',py:'Ròujiāmó',vi:'Bánh kẹp thịt',place:'陕西',loc:'Thiểm Tây',img:'06_banh_kep_thit.png'},
{cn:'叉烧',py:'Chāshāo',vi:'Thịt xá xíu',place:'广东',loc:'Quảng Đông',img:'07_thit_xa_xiu.png'},
{cn:'虾饺',py:'Xiājiǎo',vi:'Há cảo tôm',place:'广东',loc:'Quảng Đông',img:'08_ha_cao_tom.png'},
{cn:'西湖醋鱼',py:'Xīhú cùyú',vi:'Cá sốt giấm Tây Hồ',place:'浙江·杭州',loc:'Hàng Châu, Chiết Giang',img:'09_ca_sot_giam_tay_ho.png'},
{cn:'剁椒鱼头',py:'Duòjiāo yútóu',vi:'Đầu cá hấp ớt băm',place:'湖南',loc:'Hồ Nam',img:'10_dau_ca_hap_ot.png'}];
const vocab=[
['肉','ròu','Thịt'],['牛','niú','Bò'],['牛肉','niúròu','Thịt bò'],['鸭','yā','Vịt'],['烤','kǎo','Quay, nướng'],['烤鸭','kǎoyā','Vịt quay'],['鸡','jī','Gà (từ mở rộng)'],['鱼','yú','Cá'],['头','tóu','Đầu'],['鱼头','yútóu','Đầu cá'],['虾','xiā','Tôm'],['豆','dòu','Đậu'],['豆腐','dòufu','Đậu phụ'],['麻','má','Tê; cây gai'],['婆','pó','Bà, phụ nữ lớn tuổi'],['面','miàn','Mì'],['牛肉面','niúròu miàn','Mì bò'],['包','bāo','Bánh bao; gói'],['小','xiǎo','Nhỏ'],['笼','lóng','Xửng hấp, lồng'],['小笼包','xiǎolóngbāo','Tiểu long bao'],['饺','jiǎo','Bánh chẻo'],['虾饺','xiājiǎo','Há cảo tôm'],['火','huǒ','Lửa'],['锅','guō','Nồi, chảo'],['火锅','huǒguō','Lẩu'],['夹','jiā','Kẹp'],['馍','mó','Bánh bột mì'],['肉夹馍','ròujiāmó','Bánh kẹp thịt'],['叉','chā','Xiên; cái nĩa'],['烧','shāo','Nướng, nấu'],['叉烧','chāshāo','Xá xíu'],['醋','cù','Giấm'],['醋鱼','cùyú','Cá nấu với giấm'],['湖','hú','Hồ'],['西','xī','Phía tây'],['西湖','Xīhú','Tây Hồ'],['西湖醋鱼','Xīhú cùyú','Cá sốt giấm Tây Hồ'],['椒','jiāo','Ớt, tiêu'],['剁','duò','Băm, chặt nhỏ'],['剁椒','duòjiāo','Ớt băm'],['剁椒鱼头','Duòjiāo yútóu','Đầu cá hấp ớt băm']
];
const breakdown=[
['北京烤鸭','北京 (Bắc Kinh) + 烤 (quay/nướng) + 鸭 (vịt)'],['麻婆豆腐','麻婆 (Mapo, tên gọi truyền thống) + 豆腐 (đậu phụ)'],['重庆火锅','重庆 (Trùng Khánh) + 火 (lửa) + 锅 (nồi)'],['小笼包','小 (nhỏ) + 笼 (xửng hấp) + 包 (bánh bao)'],['兰州牛肉面','兰州 (Lan Châu) + 牛 (bò) + 肉 (thịt) + 面 (mì)'],['肉夹馍','肉 (thịt) + 夹 (kẹp) + 馍 (bánh bột mì)'],['叉烧','叉 (xiên) + 烧 (nướng)'],['虾饺','虾 (tôm) + 饺 (bánh chẻo)'],['西湖醋鱼','西湖 (Tây Hồ) + 醋 (giấm) + 鱼 (cá)'],['剁椒鱼头','剁 (băm) + 椒 (ớt) + 鱼 (cá) + 头 (đầu)']
];
const $=s=>document.querySelector(s),app=$('#app');let tab='list',fi=0,flipped=false,order=[],qi=0,points=0,answered=false,selected=[],kind='';const pic=d=>'images/'+d.img;const shuffle=a=>[...a].sort(()=>Math.random()-.5);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function speak(s){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang='zh-CN';u.rate=.8;speechSynthesis.speak(u)}
function setTab(t){tab=t;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));if(t==='flash')showFlash();if(t==='match')begin('match');if(t==='quiz')begin('quiz');if(t==='list')showList();if(t==='vocab')showVocab()}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
function showFlash(){let d=data[fi];app.innerHTML=`<div class="flash"><div class="status"><h2>📚 Lật thẻ học từ</h2><strong>${fi+1}/10</strong></div><div class="progress"><div style="width:${(fi+1)*10}%"></div></div><p class="muted center">Nhấn vào thẻ để xem tên món và địa phương</p><div class="flash-card" id="flip"><img src="${pic(d)}" alt="${esc(d.vi)}"><div class="detail">${flipped?`<div class="han">${d.cn}</div><div class="py">${d.py}</div><div>${d.vi} · 📍 ${d.place} (${d.loc})</div>`:'<b>👆 Nhấn để lật thẻ xem đáp án</b>'}</div></div><div class="actions"><button class="secondary" id="prev">← Trước</button><button class="primary" id="flipbtn">${flipped?'🙈 Ẩn đáp án':'👀 Xem đáp án'}</button><button class="secondary" id="next">Tiếp →</button>${flipped?'<button class="secondary" id="speak">🔊 Nghe tiếng Trung</button>':''}</div></div>`;$('#flip').onclick=$('#flipbtn').onclick=()=>{flipped=!flipped;showFlash()};$('#prev').onclick=()=>{fi=(fi+9)%10;flipped=false;showFlash()};$('#next').onclick=()=>{fi=(fi+1)%10;flipped=false;showFlash()};if(flipped)$('#speak').onclick=()=>speak(d.cn)}
function begin(k){kind=k;order=shuffle(data.map((_,i)=>i));qi=0;points=0;answered=false;showQuestion()}
function optionsFor(correct,k){let key=k==='match'?'place':'cn';let all=[...new Set(data.map(x=>x[key]))].filter(x=>x!==correct);return shuffle([correct,...shuffle(all).slice(0,3)])}
function showQuestion(){if(qi>=10){showResult();return}answered=false;let d=data[order[qi]],match=kind==='match',correct=match?d.place:d.cn;selected=optionsFor(correct,kind);app.innerHTML=`<div class="status"><h2>${match?'🗺️ Món này nổi tiếng ở đâu?':'🏆 Đây là món ăn gì?'}</h2><strong>⭐ ${points} điểm</strong></div><div class="progress"><div style="width:${qi*10}%"></div></div><p class="muted">Câu ${qi+1}/10 · ${match?'Chọn địa phương gắn với món ăn':'Chọn tên tiếng Trung đúng với hình'}</p><img class="photo" src="${pic(d)}" alt="Ảnh món ăn"><div class="question center">${match?esc(d.cn)+' · '+esc(d.py):'看图选菜名 · Nhìn ảnh chọn tên món'}</div><div class="choices">${selected.map((s,i)=>`<button class="choice" data-choice="${i}">${String.fromCharCode(65+i)}. ${esc(s)}${match?' · '+esc(data.find(x=>x.place===s)?.loc||''):''}</button>`).join('')}</div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="primary hidden" id="nextq">${qi===9?'🎉 Xem kết quả':'Câu tiếp theo →'}</button></div>`;document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>choose(Number(b.dataset.choice)));$('#nextq').onclick=()=>{qi++;showQuestion()}}
function choose(i){if(answered)return;answered=true;let d=data[order[qi]],correct=kind==='match'?d.place:d.cn,ok=selected[i]===correct;if(ok)points+=10;document.querySelectorAll('[data-choice]').forEach((b,j)=>{b.disabled=true;if(selected[j]===correct)b.classList.add('correct');else if(j===i)b.classList.add('wrong')});$('#feedback').innerHTML=`<span class="${ok?'ok':'bad'}">${ok?'✅ Chính xác! +10 điểm':'❌ Chưa đúng rồi!'}</span><div>${d.cn} · ${d.py} · ${d.vi}<br>📍 ${d.place} (${d.loc})</div>`;$('#nextq').classList.remove('hidden')}
function showResult(){app.innerHTML=`<div class="center"><h2>🎊 Hoàn thành ${kind==='match'?'ghép địa phương':'trắc nghiệm'}!</h2><p class="muted">Bạn đã hoàn thành 10 câu hỏi</p><div class="scorebig">${points}/100</div><h3>${points===100?'🏆 Xuất sắc!':points>=70?'🌟 Giỏi lắm!':'💪 Cùng ôn thêm nhé!'}</h3><p>${points/10} / 10 câu trả lời đúng</p><div class="actions"><button class="primary" id="again">🔄 Chơi lại</button><button class="secondary" id="study">📚 Ôn flashcard</button><button class="secondary" id="other">${kind==='match'?'🏆 Sang trắc nghiệm':'🗺️ Ghép địa phương'}</button></div></div>`;$('#again').onclick=()=>begin(kind);$('#study').onclick=()=>setTab('flash');$('#other').onclick=()=>setTab(kind==='match'?'quiz':'match')}
function showList(){app.innerHTML=`<div class="status"><h2>📖 10 món ăn Trung Quốc</h2><button class="secondary" id="print">🖨️ In bảng</button></div><p class="muted">Ảnh món ăn, chữ Hán, pinyin, nghĩa tiếng Việt và địa phương đặc trưng.</p><div class="study-grid">${data.map((d,i)=>`<div class="mini"><img src="${pic(d)}" alt="${esc(d.vi)}"><div><strong>${i+1}. ${d.cn}</strong><br><span class="py">${d.py}</span><br>${d.vi}<br>📍 ${d.place} · ${d.loc}<br><button class="secondary" data-say="${i}" style="margin-top:8px;padding:6px 12px">🔊 Nghe</button></div></div>`).join('')}</div>`;$('#print').onclick=()=>window.print();document.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>speak(data[+b.dataset.say].cn))}
function showVocab(){app.innerHTML=`<div class="status"><h2>🈶 Từ vựng tách nhỏ từ 10 món ăn</h2><strong>${vocab.length} từ</strong></div><p class="muted">Học từ chữ đơn → từ ghép → tên món. Nhấn 🔊 để nghe phát âm tiếng Trung.</p><div class="vocab-tools"><input id="vocabSearch" type="search" placeholder="🔎 Tìm chữ Hán, pinyin hoặc nghĩa tiếng Việt..." aria-label="Tìm từ vựng"><button class="secondary" id="printVocab">🖨️ In bảng từ</button></div><div class="vocab-table-wrap"><table class="vocab-table"><thead><tr><th>STT</th><th>Chữ Hán</th><th>Pinyin</th><th>Nghĩa</th><th>Nghe</th></tr></thead><tbody id="vocabRows"></tbody></table></div>`;const input=$('#vocabSearch');const renderRows=()=>{let q=input.value.trim().toLocaleLowerCase();let rows=vocab.map((v,i)=>({v,i})).filter(({v})=>v.some(t=>t.toLocaleLowerCase().includes(q)));$('#vocabRows').innerHTML=rows.length?rows.map(({v,i})=>`<tr><td>${i+1}</td><td class="word">${esc(v[0])}</td><td>${esc(v[1])}</td><td>${esc(v[2])}</td><td><button class="secondary" data-word="${i}" aria-label="Nghe ${esc(v[0])}">🔊</button></td></tr>`).join(''):'<tr><td colspan="5">Không tìm thấy từ phù hợp.</td></tr>';document.querySelectorAll('[data-word]').forEach(b=>b.onclick=()=>speak(vocab[Number(b.dataset.word)][0]))};input.addEventListener('input',renderRows);$('#printVocab').onclick=()=>window.print();renderRows()}
// Nhạc nền gốc tạo bằng Web Audio, không cần file âm thanh bên ngoài.
let musicContext=null,musicTimer=null,musicStep=0,musicOn=false;
const musicNotes=[392,440,523.25,659.25,587.33,523.25,440,392,329.63,392,440,523.25,440,392,329.63,293.66];
function musicNote(freq,when){
 const osc=musicContext.createOscillator(),gain=musicContext.createGain();
 osc.type='sine';osc.frequency.setValueAtTime(freq,when);
 gain.gain.setValueAtTime(0.0001,when);
 gain.gain.exponentialRampToValueAtTime(0.045,when+0.035);
 gain.gain.exponentialRampToValueAtTime(0.0001,when+0.48);
 osc.connect(gain);gain.connect(musicContext.destination);
 osc.start(when);osc.stop(when+0.5);
}
function musicTick(){if(!musicOn||!musicContext)return;musicNote(musicNotes[musicStep%musicNotes.length],musicContext.currentTime+0.02);musicStep++}
async function toggleMusic(){
 const btn=$('#musicToggle');
 if(musicOn){musicOn=false;clearInterval(musicTimer);musicTimer=null;if(musicContext)await musicContext.suspend();btn.textContent='🎵 Bật nhạc nền';btn.setAttribute('aria-pressed','false');return}
 const AC=window.AudioContext||window.webkitAudioContext;
 if(!AC){btn.textContent='🔇 Trình duyệt không hỗ trợ nhạc';btn.disabled=true;return}
 try{if(!musicContext)musicContext=new AC();await musicContext.resume();musicOn=true;musicTick();musicTimer=setInterval(musicTick,540);btn.textContent='🔇 Tắt nhạc nền';btn.setAttribute('aria-pressed','true')}
 catch(e){console.error('Không thể phát nhạc nền',e);btn.textContent='🎵 Thử bật nhạc lại'}
}
$('#musicToggle').onclick=toggleMusic;
showList();
</script></body></html>
